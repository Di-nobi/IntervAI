<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntervAI — Smart Interview Questions</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-deep:   #0a1628;
    --blue-mid:    #0f2d5e;
    --blue-vivid:  #1a56db;
    --blue-bright: #3b82f6;
    --blue-light:  #93c5fd;
    --blue-pale:   #dbeafe;
    --white:       #ffffff;
    --off-white:   #f0f6ff;
    --text-dim:    #94a3b8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--blue-deep);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    animation: drift 18s ease-in-out infinite alternate;
  }

  .orb-1 { width: 600px; height: 600px; background: var(--blue-vivid); top: -200px; left: -100px; animation-duration: 20s; }
  .orb-2 { width: 400px; height: 400px; background: var(--blue-bright); top: 40%; right: -100px; animation-duration: 25s; animation-delay: -8s; }
  .orb-3 { width: 300px; height: 300px; background: #60a5fa; bottom: -100px; left: 30%; animation-duration: 22s; animation-delay: -4s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(40px, 30px) scale(1.08); }
    100% { transform: translate(-20px, 50px) scale(0.95); }
  }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px 80px;
  }

  nav {
    width: 100%; max-width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px;
    letter-spacing: -0.5px; color: var(--white);
    display: flex; align-items: center; gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--blue-bright); border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .nav-tag {
    font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--blue-light); border: 1px solid rgba(147,197,253,0.25);
    padding: 6px 14px; border-radius: 100px;
  }

  .hero {
    width: 100%; max-width: 760px; text-align: center;
    padding: 64px 0 52px;
    animation: fadeUp 0.7s ease 0.1s both;
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; color: var(--blue-light);
    background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25);
    padding: 7px 16px; border-radius: 100px; margin-bottom: 32px;
  }

  .badge-pulse {
    width: 6px; height: 6px; background: #4ade80; border-radius: 50%;
    animation: ping 1.5s ease-in-out infinite;
  }

  @keyframes ping {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.6); }
    50% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
  }

  h1 {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: clamp(2.6rem, 7vw, 4.5rem);
    line-height: 1.05; letter-spacing: -1.5px; margin-bottom: 24px;
  }

  h1 .serif {
    font-family: 'Instrument Serif', serif; font-style: italic;
    font-weight: 400; color: var(--blue-bright);
  }

  .hero-sub {
    font-size: 17px; font-weight: 300; color: var(--text-dim);
    line-height: 1.7; max-width: 520px; margin: 0 auto;
  }

  .input-card {
    width: 100%; max-width: 640px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 28px; backdrop-filter: blur(12px);
    animation: fadeUp 0.7s ease 0.2s both;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .input-card:focus-within {
    border-color: rgba(59,130,246,0.5);
    box-shadow: 0 0 0 4px rgba(59,130,246,0.08), 0 20px 60px rgba(0,0,0,0.3);
  }

  .input-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--blue-light); margin-bottom: 12px; display: block;
  }

  .input-row { display: flex; gap: 12px; }

  input[type="text"] {
    flex: 1;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 16px 20px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--white);
    outline: none; transition: border-color 0.2s, background 0.2s; min-width: 0;
  }

  input::placeholder { color: rgba(148,163,184,0.6); }
  input:focus { border-color: var(--blue-bright); background: rgba(59,130,246,0.08); }

  .btn {
    padding: 16px 28px; background: var(--blue-vivid); color: var(--white);
    border: none; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em; cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    white-space: nowrap; position: relative; overflow: hidden;
  }

  .btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    border-radius: inherit;
  }

  .btn:hover:not(:disabled) {
    background: var(--blue-bright); transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(59,130,246,0.4);
  }

  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .loading-wrap {
    display: none; flex-direction: column; align-items: center; gap: 20px;
    padding: 52px 0; animation: fadeUp 0.4s ease both;
  }

  .loading-wrap.active { display: flex; }

  .spinner-ring {
    width: 48px; height: 48px;
    border: 3px solid rgba(59,130,246,0.2);
    border-top-color: var(--blue-bright);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 14px; color: var(--text-dim); letter-spacing: 0.05em; }

  .loading-text span {
    display: inline-block;
    animation: loadingDots 1.4s ease-in-out infinite;
  }

  .loading-text span:nth-child(2) { animation-delay: 0.2s; }
  .loading-text span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes loadingDots {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  .error-box {
    display: none; width: 100%; max-width: 640px; margin-top: 20px;
    padding: 16px 20px;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px; color: #fca5a5; font-size: 13px; line-height: 1.6;
    animation: fadeUp 0.3s ease both;
  }

  .error-box.visible { display: block; }

  .section-divider {
    width: 100%; max-width: 640px;
    display: flex; align-items: center; gap: 16px;
    margin: 48px 0 32px; opacity: 0; transition: opacity 0.5s ease;
  }

  .section-divider.visible { opacity: 1; }
  .div-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

  .div-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-dim);
  }

  .questions-wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }

  .q-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 28px 32px;
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.25s, background 0.25s, box-shadow 0.25s;
    position: relative; overflow: hidden; cursor: default;
  }

  .q-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--blue-bright), var(--blue-vivid));
    border-radius: 3px 0 0 3px; opacity: 0; transition: opacity 0.3s;
  }

  .q-card.visible { opacity: 1; transform: translateY(0); }

  .q-card:hover { background: rgba(59,130,246,0.07); border-color: rgba(59,130,246,0.25); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
  .q-card:hover::before { opacity: 1; }

  .q-number {
    font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--blue-bright);
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }

  .q-number::after { content: ''; flex: 1; height: 1px; background: rgba(59,130,246,0.2); }

  .q-text { font-family: 'Instrument Serif', serif; font-size: 19px; line-height: 1.6; color: var(--off-white); }

  footer {
    margin-top: 72px; font-size: 12px; color: rgba(148,163,184,0.5);
    letter-spacing: 0.08em; text-align: center;
    animation: fadeUp 0.7s ease 0.4s both;
  }

  footer a { color: var(--blue-light); text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
  footer a:hover { opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .input-row { flex-direction: column; }
    .btn { width: 100%; }
    h1 { letter-spacing: -0.5px; }
    .q-text { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-grid"></div>

<div class="page">
  <nav>
    <div class="logo"><div class="logo-dot"></div>IntervAI</div>
  </nav>

  <section class="hero">
    <div class="hero-badge"><div class="badge-pulse"></div>AI-Generated Interview Questions</div>
    <h1>Hire smarter with<br><span class="serif">the right questions</span></h1>
    <p class="hero-sub">Enter any job title and get 3 thoughtful, role-specific interview questions — crafted by AI in seconds.</p>
  </section>

  <div class="input-card">
    <label class="input-label" for="jobInput">Job Title</label>
    <div class="input-row">
      <input type="text" id="jobInput" placeholder="e.g. Customer Success Manager" autocomplete="off" />
      <button class="btn" id="generateBtn" onclick="generate()">Generate →</button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner-ring"></div>
    <p class="loading-text">Crafting questions<span>.</span><span>.</span><span>.</span></p>
  </div>

  <div class="section-divider" id="divider">
    <div class="div-line"></div>
    <span class="div-label">Your Questions</span>
    <div class="div-line"></div>
  </div>

  <div class="questions-wrap" id="questionsWrap"></div>

  <footer>
    IntervAI &nbsp;·&nbsp; Built with <a href="https://ai.google.dev" target="_blank">Gemini</a> &amp; <a href="https://fastapi.tiangolo.com" target="_blank">FastAPI</a>
  </footer>
</div>

<script>
  const BACKEND_URL = "http://localhost:8000"; // swap to Railway URL when deployed

  document.getElementById('jobInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') generate();
  });

  async function generate() {
    const input         = document.getElementById('jobInput');
    const btn           = document.getElementById('generateBtn');
    const loading       = document.getElementById('loadingWrap');
    const errorBox      = document.getElementById('errorBox');
    const divider       = document.getElementById('divider');
    const questionsWrap = document.getElementById('questionsWrap');

    const jobTitle = input.value.trim();
    if (!jobTitle) { input.focus(); return; }

    btn.disabled = true;
    btn.textContent = 'Generating…';
    loading.classList.add('active');
    errorBox.classList.remove('visible');
    errorBox.textContent = '';
    divider.classList.remove('visible');
    questionsWrap.innerHTML = '';

    try {
      const res = await fetch(`${BACKEND_URL}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobTitle })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      loading.classList.remove('active');
      divider.classList.add('visible');

      data.questions.forEach((q, i) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML = `
          <div class="q-number">Question ${String(i + 1).padStart(2, '0')}</div>
          <div class="q-text">${escHtml(q)}</div>
        `;
        questionsWrap.appendChild(card);
        setTimeout(() => card.classList.add('visible'), 100 + i * 160);
      });

    } catch (err) {
      loading.classList.remove('active');
      errorBox.textContent = `Something went wrong: ${err.message}`;
      errorBox.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate →';
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
